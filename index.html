<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Тимур Каргинов — Stand Up Tour</title>
    <meta name="description" content="Ближайшие концерты — Тимур Каргинов. Расписание и билеты.">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23D31D32'/%3E%3C/svg%3E">
</head>

<body>
    <main>
        <section class="hero-banner">
            <div class="circular-design">
                <div class="rotating-circles" id="circlesContainer">
                    <img src="assets/circles.png" alt="" class="circles" id="circles">
                </div>
                <div class="hero-image">
                    <img src="assets/banner.jpg" alt="Тимур Каргинов" class="hero-photo">
                </div>

            </div>
            <button id="scrollDown" class="scroll-cue" title="Прокрутить вниз">
                <img src="assets/arrow.svg" alt="Scroll down" width="34" height="34">
            </button>
        </section>

        <section id="schedule" class="schedule container">
            <h2 class="section-title">БЛИЖАЙШИЕ КОНЦЕРТЫ</h2>
            <div class="table" role="table">
                <div class="table-row table-head" role="row">
                    <div class="table-cell" role="columnheader">ДАТА</div>
                    <div class="table-cell" role="columnheader">ГОРОД</div>
                    <div class="table-cell" role="columnheader">ПЛОЩАДКА</div>
                    <div class="table-cell" role="columnheader">БИЛЕТЫ</div>
                </div>
                            </div>
        </section>
    </main>

    <footer class="site-footer container">
        <nav class="social">
            <a href="https://www.youtube.com/@KuJiPodcast" class="social-btn" title="YouTube">
                <img src="assets/yt.svg" alt="YouTube" width="22" height="22">
            </a>
        </nav>
        <div id="contacts" class="contacts-info">+7 (925) 630-60-17 (Настя)</div>
    </footer>
    <script src="scripts/main.js"></script>
</body>

</html>
